map $uri $localized_404 {
    ~^/id/ /id/404.html;
    ~^/es/ /es/404.html;
    ~^/pt-br/ /pt-br/404.html;
    default /404.html;
}

server {
    server_name blog.wldnanatayya.com;

    root /var/www/blog-releases/current;
    index index.html;

    error_page 404 =404 $localized_404;
    location = /404.html {
        internal;
    }

    # Canonical URLs have no trailing slash.
    rewrite ^/(id|es|pt-br)/(.+)/$ /$1/$2 permanent;
    rewrite ^/(.+)/$ /$1 permanent;

    # Indonesian legacy routes → canonical English routes.
    location = /perjalanan   { return 301 /journey; }
    location = /galeri       { return 301 /gallery; }
    location = /diskografi   { return 301 /discography; }
    location = /catatan-fan  { return 301 /fan-notes; }
    location = /sumber       { return 301 /sources; }
    location = /tentang-situs { return 301 /about; }

    # Content-hashed, immutable assets.
    location ^~ /assets/img/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /assets/css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /assets/js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pagefind output and unhashed OG/icon files.
    location ^~ /pagefind/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location = /site.webmanifest {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /feed.xml {
        types { application/rss+xml xml; }
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ ^/(id|es|pt-br)/feed\.xml$ {
        types { application/rss+xml xml; }
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Flat HTML files: /journey → journey.html, /journey/early → journey/early.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml application/wasm image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blog.wldnanatayya.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blog.wldnanatayya.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.blog.wldnanatayya.com;

    ssl_certificate /etc/letsencrypt/live/blog.wldnanatayya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.wldnanatayya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://blog.wldnanatayya.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.wldnanatayya.com www.blog.wldnanatayya.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog-releases/current;
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}
